<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1410">
  <title>FireLine Field</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="22" height="22"> FireLine Field</div>
    <div class="status">
      <span id="net" class="pill">online</span>
      <span id="gps" class="pill off">GPS off</span>
    </div>
  </header>

  <div id="map"></div>

  <div id="coords" class="coords">—</div>

  <!-- Drawing / measuring bar -->
  <div id="drawbar" class="drawbar hidden">
    <div id="drawinfo" class="drawinfo">Tap the map to add points</div>
    <div class="drawbtns">
      <button id="d-gps" title="Add a point at my GPS location">+ GPS</button>
      <button id="d-undo">Undo</button>
      <button id="d-cancel">Cancel</button>
      <button id="d-finish" class="primary">Finish</button>
    </div>
  </div>

  <nav class="toolbar">
    <button data-panel="layers"><span>🗺️</span>Layers</button>
    <button data-panel="collect"><span>📍</span>Collect</button>
    <button data-panel="triage"><span>🏠</span>Triage</button>
    <button data-panel="tools"><span>📏</span>Tools</button>
    <button data-panel="data"><span>💾</span>Data</button>
    <button data-panel="intel"><span>🛰️</span>Intel</button>
  </nav>

  <aside id="panel" class="panel hidden" aria-live="polite">
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close" aria-label="Close">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <div id="toast" class="toast hidden"></div>

  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <img src="icon.svg" alt="" width="56" height="56">
      <h1>FireLine Field</h1>
      <p class="hint">Crew sign-in</p>
      <label class="f">Your name<input name="name" required autocomplete="name" placeholder="J. Smith"></label>
      <label class="f">Crew / resource<input name="crew" required placeholder="E-341, Div A, Hotshots…"></label>
      <label class="f">Crew passcode<input name="pass" type="password" required autocomplete="current-password"></label>
      <div id="login-err" class="login-err hidden">Wrong passcode. Check with your crew boss.</div>
      <button class="btn primary block" type="submit">Sign in</button>
      <p class="hint small">You stay signed in on this device, so the app still opens with no signal.</p>
    </form>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js?v=3"></script>
  <script src="db.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
